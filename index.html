<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quản lý tài khoản</title>

        <style>
            body { font-family: "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f3f5f2; }
            input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; }
            button { cursor: pointer; background: #fff; }
            #list { list-style: none; padding: 0; margin: 12px 0; }
            #list li { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #d9e0db; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
            #list .t { flex: 1; overflow-wrap: anywhere; }
            button:disabled {
                background:#e3e6e4;
                color:#999;
                cursor:not-allowed;
            }
            .tab-on {
                background:#1f6f54;
                color:#fff;
                border-color:#1f6f54;
            }
            .tab-off {
                background:#e3e6e4;
                color:#999;
            }

            .flash { background:#e3e6e4 !important; color:#999 !important; }
            button { touch-action: manipulation; }
            input {font-size: 16px;}

        </style>
    </head>
    <body>
        <div id="loginBox" style="display:none">
            <div>
                <input id="email" type="email" placeholder="Email" aria-label="Email">
            </div>
            <div>
                <input id="pass" type="password" placeholder="Mật khẩu" aria-label="Mật khẩu">
                <button id="loginBtn">Đăng nhập</button>
            </div>
            <div id="loginMsg" style="color:#b3402a"></div>
        </div>
        <div id="appBox" style="display:none">
            <h1>Quản lý tài khoản</h1>
            <div>
                <label for="one">Tên tài khoản:</label>
                <input id="one" placeholder="Nhập tên tài khoản">
                <button id="addBtn">Thêm tài khoản</button>
            </div>

            <div>
                <button id="tabTodo">Chưa copy</button>
                <button id="tabDone">Đã copy</button>
            </div>

            <ul id="list"></ul>

            <button id="logoutBtn">Đăng xuất</button>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

        <script>
            const SUPABASE_URL = "https://iyrapveridnejeabjepj.supabase.co";
            const SUPABASE_KEY = "sb_publishable_Y-fw8_QC2B3euuIVcsxr9A_wOvr0_22";
            const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            let items = [];
            let view = "todo";

            function load() {   
                const saved = localStorage.getItem("acc");
                if (saved) items = JSON.parse(saved);
            }

            function save() {
                localStorage.setItem("acc", JSON.stringify(items));
            }

            function render() {
                document.getElementById("tabTodo").className = (view === "todo") ? "tab-on" : "tab-off";
                document.getElementById("tabDone").className = (view === "done") ? "tab-on" : "tab-off";
                const ul = document.getElementById("list");
                ul.innerHTML = "";
                const showCopied = (view === "done");
                const shown = items.filter(function (i) {
                    return i.copied == showCopied;
                });
                shown.forEach(function (it) {
                    const li = document.createElement("li");
                    const t = document.createElement("div");
                    t.className = "t";
                    t.textContent = it.text;

                    const btnCopy = document.createElement("button");
                    btnCopy.textContent = it.copied ? "Đã copy" : "Copy";
                    btnCopy.disabled = it.copied;
                    btnCopy.onclick = function () {
                        doCopy(it);
                    };

                    const btnRemove = document.createElement("button");
                    btnRemove.textContent = "Xóa";
                    btnRemove.onclick = function () {
                        remove(it.id);
                    };
                    li.appendChild(t);
                    li.appendChild(btnCopy);
                    li.appendChild(btnRemove);
                    ul.appendChild(li);
                });
            }

            function remove(id) {
                items = items.filter(function (i) {
                    return i.id !== id;
                });
                save();
                render();
            }

            async function doCopy(it) {
                try {
                    await navigator.clipboard.writeText(it.text);
                } catch (err) {
                    alert ("Không thể copy: " + err);
                    return;
                }
                it.copied = true;

                const conlai = items.filter(function (i) {
                    return !i.copied;
                });
                if (conlai.length === 0) {
                    items.forEach(function (i) {
                        i.copied = false;
                    });
                    view = "todo";
                    alert("Đã copy hết tài khoản, quay lại danh sách chưa copy");
                }

                save();
                render();
            }

            function add(text) {
                text = text.trim();
                if (!text) return;
                const trung = items.some(function (i) {
                    return i.text == text;
                });
                if (trung) {
                    alert("Tài khoản đã tồn tại");
                    return;
                }
                items.push({ id: Date.now(), text: text, copied: false });
                save();
                render();
            }

            function addaccount() {
                const btn = document.getElementById("addBtn");
                btn.classList.add("disabled");
                setTimeout(function () {
                    btn.classList.remove("flash");
                }, 200);

                const o = document.getElementById("one");
                const giatri = o.value;
                add(giatri);
                o.value = "";
                requestAnimationFrame(render);
            }

            document.getElementById("addBtn").addEventListener("click", addaccount);

            document.getElementById("one").addEventListener("keydown", function (e) {
                if (e.key == "Enter") {
                    e.preventDefault();
                    addaccount();
                }
            });

            document.getElementById("tabTodo").onclick = function () {
                view = "todo";
                render();
            };

            document.getElementById("tabDone").onclick = function () {
                view = "done";
                render();
            };
            
            function showLogin() {
                document.getElementById("loginBox").style.display = "block";
                document.getElementById("appBox").style.display = "none";
            }

            function showApp() {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("appBox").style.display = "block";
            }

            async function checkLogin() {
            const res = await db.auth.getSession();
                if (res.data.session) {
                showApp();
                } else {
                    showLogin();
                }
            }

            async function dangNhap() {
                document.getElementById("loginMsg").textContent = "";
                const res = await db.auth.signInWithPassword({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("pass").value
            });
            if (res.error) {
                document.getElementById("loginMsg").textContent = "Sai email hoặc mật khẩu";
                return;
            }
            document.getElementById("pass").value = "";
            checkLogin();
            }

            async function dangXuat() {
                await db.auth.signOut();
                checkLogin();
            }

            document.getElementById("loginBtn").onclick = dangNhap;
            document.getElementById("logoutBtn").onclick = dangXuat;
            document.getElementById("pass").addEventListener("keydown", function (e) {
                if (e.key === "Enter") dangNhap();
            });
            load();
            render();
            checkLogin();
        </script>

    </body>
</html>
